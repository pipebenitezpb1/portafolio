<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" font-family="'Segoe UI', system-ui, Arial, sans-serif">
  <defs>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <filter id="sombraSuave" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <radialGradient id="luz" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cavidad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="1600" height="1150" fill="#f4f6fb"/>

  <!-- Franja de acento superior (3 tipologías) -->
  <rect x="0" y="0" width="533" height="8" fill="#2563eb"/>
  <rect x="533" y="0" width="534" height="8" fill="#f59e0b"/>
  <rect x="1067" y="0" width="533" height="8" fill="#a855f7"/>

  <!-- Cabecera -->
  <rect x="0" y="8" width="1600" height="128" fill="#101728"/>
  <text x="44" y="62" fill="#ffffff" font-size="34" font-weight="700" letter-spacing="1.5">ANÁLISIS DE INTERFACES</text>
  <text x="44" y="104" fill="#93a3c4" font-size="21">Horno de Microondas · Interfaces de Entrada y Salida</text>
  <text x="1556" y="46" fill="#e6e8ef" font-size="16" font-weight="600" text-anchor="end">Universidad Adolfo Ibáñez</text>
  <text x="1556" y="72" fill="#93a3c4" font-size="15" text-anchor="end">Taller de Interfaces · 2026 · Prof. Jorge Forero</text>
  <text x="1556" y="98" fill="#93a3c4" font-size="15" text-anchor="end">Entrega N°1 · Autor: Luis Felipe Benítez</text>

  <!-- Leyenda de tipologías -->
  <g font-size="15">
    <rect x="44" y="160" width="1512" height="52" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#sombraSuave)"/>
    <text x="66" y="192" fill="#334155" font-weight="700" font-size="14">TIPOLOGÍAS:</text>

    <circle cx="205" cy="187" r="8" fill="#2563eb"/>
    <text x="222" y="192" fill="#0f172a" font-weight="600">Física</text>
    <text x="290" y="192" fill="#64748b">— interacción mecánica / táctil directa</text>

    <circle cx="640" cy="187" r="8" fill="#f59e0b"/>
    <text x="657" y="192" fill="#0f172a" font-weight="600">Gráfica / Visual</text>
    <text x="785" y="192" fill="#64748b">— información por luz o pantalla</text>

    <circle cx="1120" cy="187" r="8" fill="#a855f7"/>
    <text x="1137" y="192" fill="#0f172a" font-weight="600">Acústica / Audio</text>
    <text x="1268" y="192" fill="#64748b">— señales sonoras</text>
  </g>

  <!-- Etiquetas de sección -->
  <text x="44" y="262" fill="#0f172a" font-size="22" font-weight="800" letter-spacing="1">ENTRADAS (INPUTS)</text>
  <text x="1556" y="262" fill="#0f172a" font-size="22" font-weight="800" letter-spacing="1" text-anchor="end">SALIDAS (OUTPUTS)</text>
  <line x1="44" y1="278" x2="360" y2="278" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="1240" y1="278" x2="1556" y2="278" stroke="#cbd5e1" stroke-width="2"/>

  <!-- ================= CONECTORES (debajo de las tarjetas y el producto) ================= -->
  <g stroke-width="2" opacity="0.55" fill="none">
    <!-- Entradas -->
    <path d="M340 359 L858 650" stroke="#2563eb"/>
    <path d="M340 504 L845 560" stroke="#2563eb"/>
    <path d="M340 649 L835 468" stroke="#2563eb"/>
    <path d="M340 794 L600 772" stroke="#2563eb"/>
    <!-- Salidas -->
    <path d="M1260 339 L1016 498" stroke="#f59e0b"/>
    <path d="M1260 482 L772 505" stroke="#f59e0b"/>
    <path d="M1260 625 L716 706" stroke="#2563eb"/>
    <path d="M1260 768 L720 585" stroke="#2563eb"/>
    <path d="M1260 911 L1004 712" stroke="#a855f7"/>
  </g>
  <!-- Puntos de anclaje en el producto -->
  <g>
    <circle cx="858" cy="650" r="5" fill="#2563eb"/>
    <circle cx="845" cy="560" r="5" fill="#2563eb"/>
    <circle cx="835" cy="468" r="5" fill="#2563eb"/>
    <circle cx="600" cy="772" r="5" fill="#2563eb"/>
    <circle cx="1016" cy="498" r="5" fill="#f59e0b"/>
    <circle cx="772" cy="505" r="5" fill="#f59e0b"/>
    <circle cx="716" cy="706" r="5" fill="#2563eb"/>
    <circle cx="720" cy="585" r="5" fill="#2563eb"/>
    <circle cx="1004" cy="712" r="5" fill="#a855f7"/>
  </g>

  <!-- ================= PRODUCTO: MICROONDAS ================= -->
  <g filter="url(#sombra)">
    <rect x="555" y="430" width="490" height="330" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  </g>
  <!-- Marco de la puerta -->
  <rect x="575" y="455" width="270" height="280" rx="10" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Ventana / cavidad -->
  <rect x="595" y="475" width="230" height="240" rx="6" fill="url(#cavidad)"/>
  <!-- rejilla de la ventana -->
  <g stroke="#475569" stroke-width="1" opacity="0.5">
    <line x1="620" y1="475" x2="620" y2="715"/>
    <line x1="650" y1="475" x2="650" y2="715"/>
    <line x1="680" y1="475" x2="680" y2="715"/>
    <line x1="710" y1="475" x2="710" y2="715"/>
    <line x1="740" y1="475" x2="740" y2="715"/>
    <line x1="770" y1="475" x2="770" y2="715"/>
    <line x1="800" y1="475" x2="800" y2="715"/>
  </g>
  <!-- Luz interior -->
  <ellipse cx="710" cy="520" rx="120" ry="70" fill="url(#luz)"/>
  <!-- Ondas de calor -->
  <g stroke="#f59e0b" stroke-width="3" fill="none" opacity="0.8" stroke-linecap="round">
    <path d="M660 575 q10 -12 20 0 q10 12 20 0 q10 -12 20 0"/>
    <path d="M660 595 q10 -12 20 0 q10 12 20 0 q10 -12 20 0" opacity="0.6"/>
  </g>
  <!-- Plato giratorio -->
  <ellipse cx="710" cy="690" rx="95" ry="20" fill="#475569"/>
  <ellipse cx="710" cy="686" rx="70" ry="14" fill="#64748b"/>
  <!-- alimento sobre el plato -->
  <circle cx="710" cy="678" r="26" fill="#cbd5e1"/>
  <circle cx="710" cy="678" r="26" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <!-- Manija de la puerta -->
  <rect x="838" y="475" width="12" height="240" rx="6" fill="#94a3b8"/>

  <!-- Panel de control -->
  <rect x="858" y="455" width="167" height="280" rx="10" fill="#0f172a"/>
  <!-- Display -->
  <rect x="878" y="472" width="128" height="46" rx="6" fill="#062a20"/>
  <text x="994" y="504" fill="#34d399" font-family="'Consolas', monospace" font-size="28" font-weight="700" text-anchor="end" letter-spacing="2">12:00</text>
  <!-- Botonera -->
  <g>
    <rect x="878" y="534" width="38" height="34" rx="5" fill="#1e293b"/>
    <rect x="923" y="534" width="38" height="34" rx="5" fill="#1e293b"/>
    <rect x="968" y="534" width="38" height="34" rx="5" fill="#1e293b"/>
    <rect x="878" y="576" width="38" height="34" rx="5" fill="#1e293b"/>
    <rect x="923" y="576" width="38" height="34" rx="5" fill="#1e293b"/>
    <rect x="968" y="576" width="38" height="34" rx="5" fill="#1e293b"/>
    <rect x="878" y="618" width="38" height="34" rx="5" fill="#1e293b"/>
    <rect x="923" y="618" width="38" height="34" rx="5" fill="#1e293b"/>
    <rect x="968" y="618" width="38" height="34" rx="5" fill="#1e293b"/>
    <!-- Iniciar / Detener -->
    <rect x="878" y="660" width="60" height="34" rx="5" fill="#16a34a"/>
    <text x="908" y="682" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">INICIO</text>
    <rect x="946" y="660" width="60" height="34" rx="5" fill="#dc2626"/>
    <text x="976" y="682" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">STOP</text>
  </g>
  <!-- Altavoz (beep) -->
  <g fill="#334155">
    <circle cx="996" cy="708" r="2.5"/><circle cx="1004" cy="708" r="2.5"/><circle cx="1012" cy="708" r="2.5"/>
    <circle cx="996" cy="716" r="2.5"/><circle cx="1004" cy="716" r="2.5"/><circle cx="1012" cy="716" r="2.5"/>
  </g>
  <!-- ondas de sonido -->
  <g stroke="#a855f7" stroke-width="2.5" fill="none" opacity="0.8" stroke-linecap="round">
    <path d="M1022 700 q10 12 0 24"/>
    <path d="M1030 694 q16 18 0 36" opacity="0.6"/>
  </g>
  <!-- Cable / enchufe -->
  <path d="M600 760 L600 800 Q600 812 588 812 L560 812" stroke="#64748b" stroke-width="4" fill="none"/>
  <rect x="524" y="800" width="34" height="24" rx="4" fill="#334155"/>
  <line x1="514" y1="806" x2="524" y2="806" stroke="#334155" stroke-width="3"/>
  <line x1="514" y1="818" x2="524" y2="818" stroke="#334155" stroke-width="3"/>
  <text x="541" y="846" fill="#64748b" font-size="12" text-anchor="middle">Enchufe</text>

  <!-- ================= TARJETAS: ENTRADAS (izquierda) ================= -->
  <!-- L1 Teclado -->
  <g filter="url(#sombraSuave)"><rect x="44" y="295" width="300" height="128" rx="14" fill="#ffffff" stroke="#e2e8f0"/></g>
  <rect x="44" y="295" width="6" height="128" rx="3" fill="#2563eb"/>
  <rect x="66" y="311" width="80" height="22" rx="11" fill="#2563eb" fill-opacity="0.12"/>
  <text x="106" y="326" fill="#2563eb" font-size="11" font-weight="700" text-anchor="middle">FÍSICA</text>
  <text x="66" y="360" fill="#0f172a" font-size="19" font-weight="700">Teclado / Botones</text>
  <text x="66" y="386" fill="#475569" font-size="14">Pulsación mecánica de teclas para fijar</text>
  <text x="66" y="406" fill="#475569" font-size="14">tiempo, potencia y funciones.</text>
  <circle cx="341" cy="359" r="5" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>

  <!-- L2 Manija/puerta -->
  <g filter="url(#sombraSuave)"><rect x="44" y="440" width="300" height="128" rx="14" fill="#ffffff" stroke="#e2e8f0"/></g>
  <rect x="44" y="440" width="6" height="128" rx="3" fill="#2563eb"/>
  <rect x="66" y="456" width="80" height="22" rx="11" fill="#2563eb" fill-opacity="0.12"/>
  <text x="106" y="471" fill="#2563eb" font-size="11" font-weight="700" text-anchor="middle">FÍSICA</text>
  <text x="66" y="505" fill="#0f172a" font-size="19" font-weight="700">Manija / Puerta</text>
  <text x="66" y="531" fill="#475569" font-size="14">Acción física para abrir la puerta y</text>
  <text x="66" y="551" fill="#475569" font-size="14">acceder a la cavidad.</text>
  <circle cx="341" cy="504" r="5" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>

  <!-- L3 Sensor puerta -->
  <g filter="url(#sombraSuave)"><rect x="44" y="585" width="300" height="128" rx="14" fill="#ffffff" stroke="#e2e8f0"/></g>
  <rect x="44" y="585" width="6" height="128" rx="3" fill="#2563eb"/>
  <rect x="66" y="601" width="80" height="22" rx="11" fill="#2563eb" fill-opacity="0.12"/>
  <text x="106" y="616" fill="#2563eb" font-size="11" font-weight="700" text-anchor="middle">FÍSICA</text>
  <text x="66" y="650" fill="#0f172a" font-size="19" font-weight="700">Sensor de puerta</text>
  <text x="66" y="676" fill="#475569" font-size="14">Interruptor de seguridad que detecta</text>
  <text x="66" y="696" fill="#475569" font-size="14">si la puerta está cerrada.</text>
  <circle cx="341" cy="649" r="5" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>

  <!-- L4 Enchufe -->
  <g filter="url(#sombraSuave)"><rect x="44" y="730" width="300" height="128" rx="14" fill="#ffffff" stroke="#e2e8f0"/></g>
  <rect x="44" y="730" width="6" height="128" rx="3" fill="#2563eb"/>
  <rect x="66" y="746" width="80" height="22" rx="11" fill="#2563eb" fill-opacity="0.12"/>
  <text x="106" y="761" fill="#2563eb" font-size="11" font-weight="700" text-anchor="middle">FÍSICA</text>
  <text x="66" y="795" fill="#0f172a" font-size="19" font-weight="700">Enchufe / Alimentación</text>
  <text x="66" y="821" fill="#475569" font-size="14">Conexión eléctrica que entrega la</text>
  <text x="66" y="841" fill="#475569" font-size="14">energía al equipo.</text>
  <circle cx="341" cy="794" r="5" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>

  <!-- ================= TARJETAS: SALIDAS (derecha) ================= -->
  <!-- R1 Display -->
  <g filter="url(#sombraSuave)"><rect x="1256" y="275" width="300" height="128" rx="14" fill="#ffffff" stroke="#e2e8f0"/></g>
  <rect x="1550" y="275" width="6" height="128" rx="3" fill="#f59e0b"/>
  <rect x="1454" y="291" width="102" height="22" rx="11" fill="#f59e0b" fill-opacity="0.15"/>
  <text x="1505" y="306" fill="#b45309" font-size="11" font-weight="700" text-anchor="middle">VISUAL</text>
  <text x="1278" y="340" fill="#0f172a" font-size="19" font-weight="700">Pantalla / Display</text>
  <text x="1278" y="366" fill="#475569" font-size="14">Muestra el reloj, el tiempo restante</text>
  <text x="1278" y="386" fill="#475569" font-size="14">y el modo seleccionado.</text>
  <circle cx="1259" cy="339" r="5" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/>

  <!-- R2 Luz interior -->
  <g filter="url(#sombraSuave)"><rect x="1256" y="418" width="300" height="128" rx="14" fill="#ffffff" stroke="#e2e8f0"/></g>
  <rect x="1550" y="418" width="6" height="128" rx="3" fill="#f59e0b"/>
  <rect x="1454" y="434" width="102" height="22" rx="11" fill="#f59e0b" fill-opacity="0.15"/>
  <text x="1505" y="449" fill="#b45309" font-size="11" font-weight="700" text-anchor="middle">VISUAL</text>
  <text x="1278" y="483" fill="#0f172a" font-size="19" font-weight="700">Luz interior</text>
  <text x="1278" y="509" fill="#475569" font-size="14">Ilumina la cavidad para observar</text>
  <text x="1278" y="529" fill="#475569" font-size="14">los alimentos durante el ciclo.</text>
  <circle cx="1259" cy="482" r="5" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/>

  <!-- R3 Plato giratorio -->
  <g filter="url(#sombraSuave)"><rect x="1256" y="561" width="300" height="128" rx="14" fill="#ffffff" stroke="#e2e8f0"/></g>
  <rect x="1550" y="561" width="6" height="128" rx="3" fill="#2563eb"/>
  <rect x="1454" y="577" width="102" height="22" rx="11" fill="#2563eb" fill-opacity="0.12"/>
  <text x="1505" y="592" fill="#2563eb" font-size="11" font-weight="700" text-anchor="middle">FÍSICA</text>
  <text x="1278" y="626" fill="#0f172a" font-size="19" font-weight="700">Plato giratorio</text>
  <text x="1278" y="652" fill="#475569" font-size="14">Movimiento rotatorio que distribuye</text>
  <text x="1278" y="672" fill="#475569" font-size="14">el calor de forma uniforme.</text>
  <circle cx="1259" cy="625" r="5" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>

  <!-- R4 Calor -->
  <g filter="url(#sombraSuave)"><rect x="1256" y="704" width="300" height="128" rx="14" fill="#ffffff" stroke="#e2e8f0"/></g>
  <rect x="1550" y="704" width="6" height="128" rx="3" fill="#2563eb"/>
  <rect x="1454" y="720" width="102" height="22" rx="11" fill="#2563eb" fill-opacity="0.12"/>
  <text x="1505" y="735" fill="#2563eb" font-size="11" font-weight="700" text-anchor="middle">FÍSICA</text>
  <text x="1278" y="769" fill="#0f172a" font-size="19" font-weight="700">Calor (microondas)</text>
  <text x="1278" y="795" fill="#475569" font-size="14">Radiación que calienta el alimento:</text>
  <text x="1278" y="815" fill="#475569" font-size="14">la salida térmica principal.</text>
  <circle cx="1259" cy="768" r="5" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>

  <!-- R5 Beep -->
  <g filter="url(#sombraSuave)"><rect x="1256" y="847" width="300" height="128" rx="14" fill="#ffffff" stroke="#e2e8f0"/></g>
  <rect x="1550" y="847" width="6" height="128" rx="3" fill="#a855f7"/>
  <rect x="1440" y="863" width="116" height="22" rx="11" fill="#a855f7" fill-opacity="0.14"/>
  <text x="1498" y="878" fill="#7e22ce" font-size="11" font-weight="700" text-anchor="middle">ACÚSTICA</text>
  <text x="1278" y="912" fill="#0f172a" font-size="19" font-weight="700">Señal sonora (beep)</text>
  <text x="1278" y="938" fill="#475569" font-size="14">Pitido al terminar el ciclo o al</text>
  <text x="1278" y="958" fill="#475569" font-size="14">confirmar la pulsación de teclas.</text>
  <circle cx="1259" cy="911" r="5" fill="#ffffff" stroke="#a855f7" stroke-width="2.5"/>

  <!-- Etiqueta del producto -->
  <text x="800" y="800" fill="#0f172a" font-size="18" font-weight="700" text-anchor="middle">Horno de Microondas</text>

  <!-- ================= RESUMEN / MATRIZ ================= -->
  <g>
    <rect x="555" y="828" width="490" height="150" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#sombraSuave)"/>
    <text x="576" y="858" fill="#0f172a" font-size="15" font-weight="800" letter-spacing="0.5">RESUMEN DE INTERFACES</text>
    <line x1="576" y1="870" x2="1024" y2="870" stroke="#e2e8f0" stroke-width="1.5"/>

    <circle cx="584" cy="895" r="6" fill="#2563eb"/>
    <text x="598" y="900" fill="#334155" font-size="13.5"><tspan font-weight="700">Física:</tspan> teclado, puerta, sensor, enchufe, plato, calor</text>

    <circle cx="584" cy="923" r="6" fill="#f59e0b"/>
    <text x="598" y="928" fill="#334155" font-size="13.5"><tspan font-weight="700">Visual:</tspan> display, luz interior</text>

    <circle cx="584" cy="951" r="6" fill="#a855f7"/>
    <text x="598" y="956" fill="#334155" font-size="13.5"><tspan font-weight="700">Acústica:</tspan> señal sonora (beep)</text>
  </g>

  <!-- Pie -->
  <line x1="44" y1="1010" x2="1556" y2="1010" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="44" y="1040" fill="#64748b" font-size="14">Diagrama vectorial esquemático de elaboración propia. Créditos: ilustración original del autor (SVG).</text>
  <text x="1556" y="1040" fill="#64748b" font-size="14" text-anchor="end">Universidad Adolfo Ibáñez · Taller de Interfaces · 2026 · Entrega N°1</text>
</svg>
